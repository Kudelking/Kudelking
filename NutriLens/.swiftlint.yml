included:
  - App
  - Packages
excluded:
  - "**/.build"
  - "**/*.generated.swift"

opt_in_rules:
  - empty_count
  - explicit_init
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - unused_import

line_length:
  warning: 120
  error: 160
  ignores_comments: true

type_body_length:
  warning: 300

file_length:
  warning: 500

force_cast: error
force_try: error

identifier_name:
  min_length: 2
  excluded: [id, x, y, p, c, f]
