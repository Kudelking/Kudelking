included:
  - App
  - Packages
excluded:
  - "**/.build"
  - "**/*.generated.swift"
  - "**/Tests"          # test doubles favor brevity over lint pedantry

opt_in_rules:
  - closure_spacing
  - contains_over_first_not_nil
  - fatal_error_message
  - first_where
  - redundant_nil_coalescing

line_length:
  warning: 120
  error: 200
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 320

file_length:
  warning: 500

force_cast: error
force_try: error

identifier_name:
  min_length: 1
  excluded: [id, x, y, p, c, f, n, v, a, b]
