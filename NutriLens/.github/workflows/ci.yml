name: NutriLens CI

on:
  pull_request:
    paths: ["NutriLens/**"]
  push:
    branches: [main]
    paths: ["NutriLens/**"]

jobs:
  swift:
    name: Swift build & test
    runs-on: macos-15
    defaults:
      run:
        working-directory: NutriLens
    steps:
      - uses: actions/checkout@v4

      # Advisory until a formatting pass runs in Xcode; does not block the build/test signal.
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          brew install swiftlint swiftformat
          swiftlint
          swiftformat --lint .

      - name: Test Swift packages (iOS Simulator)
        run: |
          set -eo pipefail
          # iOS-only packages import UIKit/Vision/uiColor, so they must build for iOS, not the
          # macOS host. Each SPM package is driven via xcodebuild against an iOS simulator; the
          # implicit scheme name equals the package name.
          DEST='platform=iOS Simulator,name=iPhone 16,OS=latest'
          run_pkg() { # <path> <scheme> <action>
            echo "== $3 $2 =="
            ( cd "$1" && xcodebuild "$3" \
                -scheme "$2" -destination "$DEST" \
                -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO )
          }
          # CoreUI has no test target — build only.
          run_pkg Packages/Core/CoreUI CoreUI build
          # Everything else has tests.
          run_pkg Packages/Core/CoreModels CoreModels test
          run_pkg Packages/Core/CoreConcurrency CoreConcurrency test
          run_pkg Packages/Core/CorePersistence CorePersistence test
          run_pkg Packages/Networking/APIClient APIClient test
          run_pkg Packages/Networking/NutritionDB NutritionDB test
          run_pkg Packages/Networking/AIGateway AIGateway test
          run_pkg Packages/Platform/VisionService VisionService test
          run_pkg Packages/Features/Authentication Authentication test
          run_pkg Packages/Features/Onboarding Onboarding test
          run_pkg Packages/Features/MealCapture MealCapture test
          run_pkg Packages/Features/Home Home test

  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NutriLens/backend/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
